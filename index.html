<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abingdon Lesson Timer</title>
    <!-- Pulling in a clean, modern font to match Abingdon's recent rebrand -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --abingdon-cerise: #E64097;
            --abingdon-navy: #0F172A;
            --abingdon-grey: #64748B;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--abingdon-navy);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
            /* Abingdon Cerise brand accent */
            border-top: 8px solid var(--abingdon-cerise); 
        }

        .brand-title {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--abingdon-cerise);
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--abingdon-navy);
            font-weight: 600;
            margin-bottom: 25px;
            margin-top: 5px;
        }

        select {
            width: 100%;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            padding: 12px;
            margin: 10px 0 25px 0;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            color: var(--abingdon-navy);
            background-color: #F8FAFC;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--abingdon-cerise);
        }

        #status {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--abingdon-grey);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #timer {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--abingdon-navy);
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        /* Pulse animation for when the lesson is active */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .active-lesson {
            color: var(--abingdon-cerise) !important;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="brand-title">Abingdon</h1>
    <div class="brand-subtitle">Lesson Timer</div>
    
    <label for="periodSelect" style="display:none;">Select Period</label>
    <select id="periodSelect">
        <!-- Options will be populated by JavaScript -->
    </select>

    <div id="status">Loading...</div>
    <div id="timer">00:00</div>
</div>

<script>
    // School Schedule setup (Start and End times in 24h format)
    const schedule = {
        'p1': { start: '09:00', end: '09:55', label: 'P1 (9:00 am - 9:55 am)' },
        'p2': { start: '10:00', end: '10:55', label: 'P2 (10:00 am - 10:55 am)' },
        'p3': { start: '11:15', end: '12:10', label: 'P3 (11:15 am - 12:10 pm)' },
        'p4': { start: '12:15', end: '13:05', label: 'P4 (12:15 pm - 1:05 pm)' },
        'p5': { start: '12:55', end: '13:45', label: 'P5 (12:55 pm - 1:45 pm)' },
        'p6': { start: '14:05', end: '14:55', label: 'P6 (2:05 pm - 2:55 pm)' },
        'p7': { start: '15:00', end: '15:55', label: 'P7 (3:00 pm - 3:55 pm)' }
    };

    const periodSelect = document.getElementById('periodSelect');
    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');

    // Populate the dropdown programmatically
    for (const [key, data] of Object.entries(schedule)) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = data.label;
        periodSelect.appendChild(option);
    }

    // Helper function to build a Date object for today from a "HH:MM" string
    function getTimeObject(timeStr) {
        const [hours, minutes] = timeStr.split(':');
        const dateObj = new Date();
        dateObj.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0, 0);
        return dateObj;
    }

    // Helper function to format milliseconds into HH:MM:SS or MM:SS
    function formatTimeRemaining(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        const parts = [];
        if (hours > 0) parts.push(hours.toString().padStart(2, '0'));
        parts.push(minutes.toString().padStart(2, '0'));
        parts.push(seconds.toString().padStart(2, '0'));
        
        return parts.join(':');
    }

    function updateTimer() {
        const now = new Date();
        const selectedPeriod = schedule[periodSelect.value];
        
        const startTime = getTimeObject(selectedPeriod.start);
        const endTime = getTimeObject(selectedPeriod.end);

        // 1. Before the lesson has started
        if (now < startTime) {
            timerDisplay.classList.remove('active-lesson');
            timerDisplay.style.color = 'var(--abingdon-navy)';
            statusDisplay.textContent = "Lesson starts in:";
            timerDisplay.textContent = formatTimeRemaining(startTime - now);
        } 
        // 2. During the lesson
        else if (now >= startTime && now < endTime) {
            timerDisplay.classList.add('active-lesson'); // Adds the pink pulse effect
            statusDisplay.textContent = "Time remaining:";
            timerDisplay.textContent = formatTimeRemaining(endTime - now);
        } 
        // 3. After the lesson has finished
        else {
            timerDisplay.classList.remove('active-lesson');
            timerDisplay.style.color = '#10B981'; // Green to indicate completion
            statusDisplay.textContent = "Lesson Finished!";
            timerDisplay.textContent = "00:00";
        }
    }

    // Listen for dropdown changes
    periodSelect.addEventListener('change', updateTimer);
    
    // Start interval
    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
