<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Countdown Timer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #2c3e50;
        }
        select {
            width: 100%;
            font-size: 1.2rem;
            padding: 10px;
            margin: 20px 0;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #3498db;
        }
        #timer {
            font-size: 4rem;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 10px;
            font-variant-numeric: tabular-nums; /* Keeps numbers from shifting */
        }
        #status {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lesson Countdown</h1>
    
    <label for="periodSelect" style="display:none;">Select Period</label>
    <select id="periodSelect">
        <!-- Values are the end times in 24-hour HH:MM format -->
        <option value="09:55">P1 (9:00 am - 9:55 am)</option>
        <option value="10:55">P2 (10:00 am - 10:55 am)</option>
        <option value="12:10">P3 (11:15 am - 12:10 pm)</option>
        <option value="13:05">P4 (12:15 pm - 1:05 pm)</option>
        <option value="13:45">P5 (12:55 pm - 1:45 pm)</option>
        <option value="14:55">P6 (2:05 pm - 2:55 pm)</option>
        <option value="15:55">P7 (3:00 pm - 3:55 pm)</option>
    </select>

    <div id="status">Time remaining:</div>
    <div id="timer">00:00:00</div>
</div>

<script>
    const periodSelect = document.getElementById('periodSelect');
    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');

    function updateTimer() {
        const now = new Date();
        const endStr = periodSelect.value.split(':');
        
        // Create a date object for the end time of the selected period today
        const endTime = new Date();
        endTime.setHours(parseInt(endStr[0], 10));
        endTime.setMinutes(parseInt(endStr[1], 10));
        endTime.setSeconds(0);
        endTime.setMilliseconds(0);

        // Calculate the difference in milliseconds
        const diff = endTime - now;

        if (diff <= 0) {
            timerDisplay.textContent = "00:00:00";
            timerDisplay.style.color = "#27ae60"; // Green for finished
            statusDisplay.textContent = "This lesson has finished!";
        } else {
            timerDisplay.style.color = "#e74c3c"; // Red for counting down
            statusDisplay.textContent = "Time remaining:";
            
            // Convert to hours, minutes, and seconds
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            // Format with leading zeros
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');

            if (hours > 0) {
                timerDisplay.textContent = `${formattedHours}:${formattedMinutes}:${formattedSeconds}`;
            } else {
                timerDisplay.textContent = `${formattedMinutes}:${formattedSeconds}`;
            }
        }
    }

    // Update immediately, then every second
    periodSelect.addEventListener('change', updateTimer);
    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
